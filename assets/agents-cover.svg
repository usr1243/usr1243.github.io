<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1428"/>
      <stop offset="1" stop-color="#1a2350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#5b74ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b74ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#9db0ff" stroke-width="1.6"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>

  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="72" y="92" font-size="20" fill="#9db0ff" letter-spacing="3">CLAUDE-AGENT-TOOLKIT</text>
    <text x="72" y="690" font-size="18" fill="#7f8cc4" letter-spacing="1">5 AGENTS · MULTI-LAYER ORCHESTRATION · OPEN SOURCE</text>
  </g>

  <!-- connectors -->
  <g stroke="#7f93ff" stroke-width="2.5" fill="none" marker-end="url(#ar)" opacity="0.9">
    <path d="M400,375 C470,375 470,165 560,165"/>
    <path d="M400,375 C470,375 470,270 560,270"/>
    <path d="M400,375 L560,375"/>
    <path d="M400,375 C470,375 470,480 560,480"/>
    <path d="M400,375 C470,375 470,585 560,585"/>
  </g>

  <!-- Orchestrator -->
  <g filter="url(#sh)">
    <rect x="170" y="325" width="230" height="100" rx="18" fill="#4660ff"/>
  </g>
  <text x="285" y="372" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Orchestrator</text>
  <text x="285" y="400" text-anchor="middle" font-size="15" fill="#d6ddff">reads · routes · merges</text>

  <!-- Agents -->
  <g filter="url(#sh)">
    <rect x="560" y="130" width="360" height="70" rx="14" fill="#1c2652" stroke="#3a4a9a"/>
    <rect x="560" y="235" width="360" height="70" rx="14" fill="#1c2652" stroke="#3a4a9a"/>
    <rect x="560" y="340" width="360" height="70" rx="14" fill="#1c2652" stroke="#3a4a9a"/>
    <rect x="560" y="445" width="360" height="70" rx="14" fill="#1c2652" stroke="#3a4a9a"/>
    <rect x="560" y="550" width="360" height="70" rx="14" fill="#1c2652" stroke="#3a4a9a"/>
  </g>
  <g font-size="21" font-weight="600" fill="#eef1ff">
    <text x="592" y="171">Coaches</text>
    <text x="592" y="276">Deep-Debug</text>
    <text x="592" y="381">Bewerbung</text>
    <text x="592" y="486">Prompt-Improver</text>
    <text x="592" y="591">Skillcheck</text>
  </g>
  <g font-size="14" fill="#8c9bd8" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace">
    <text x="896" y="171" text-anchor="end">sub-agents</text>
    <text x="896" y="276" text-anchor="end">5 phases · swarm</text>
    <text x="896" y="381" text-anchor="end">agent</text>
    <text x="896" y="486" text-anchor="end">agent</text>
    <text x="896" y="591" text-anchor="end">agent</text>
  </g>
</svg>
